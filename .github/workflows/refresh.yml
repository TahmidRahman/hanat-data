name: Refresh mosque data

# Rebuilds the area files from OpenStreetMap on the first day of each month.
# It can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build area files
        run: python3 -u tools/build_mosque_tiles.py --out v1

      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A v1
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh mosque data from OpenStreetMap"
            git push
          fi
