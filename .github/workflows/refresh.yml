name: Refresh mosque data

# Rebuilds the area files from OpenStreetMap's country files on Geofabrik every Monday.
# Regions that fail on one run keep their earlier data and are picked up by a later run.
# It can also be started by hand from the Actions tab, optionally for named regions only.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik region names, space separated (empty for all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Build area files
        # Country files are downloaded to the runner's large scratch disk and deleted once read.
        # Stops starting new regions after 4.5 hours so the job ends well inside its limit.
        run: |
          sudo mkdir -p /mnt/hanat && sudo chown "$USER" /mnt/hanat
          python3 -u tools/build_mosque_tiles.py ${{ inputs.regions }}
        env:
          HANAT_WORK: /mnt/hanat
          HANAT_PARALLEL: "3"
          HANAT_TIME_BUDGET: "16200"

      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A v1 countries coverage.json tools/geofabrik-index.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh mosque data from OpenStreetMap"
            git push
          fi
